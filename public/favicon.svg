<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="poppysGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF6BA" />
      <stop offset="25%" stop-color="#BF953F" />
      <stop offset="50%" stop-color="#FBF5B7" />
      <stop offset="75%" stop-color="#B38728" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070e1c" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Shield Badge -->
  <rect width="100" height="100" rx="22" fill="url(#bgDark)" />
  <rect x="2" y="2" width="96" height="96" rx="20" fill="none" stroke="url(#poppysGold)" stroke-width="1.8" stroke-opacity="0.6" />

  <!-- Poppys Royal Lotus Crest Emblem -->
  <g filter="url(#goldGlow)" transform="translate(50, 44)">
    <!-- Center Spire -->
    <path d="M 0,-24 C -3,-14 -3,-4 0,10 C 3,-4 3,-14 0,-24 Z" fill="url(#poppysGold)" />
    
    <!-- Inner Petals -->
    <path d="M -4,-2 C -11,-12 -18,-14 -17,-2 C -16,8 -7,10 0,12 C -4,7 -5,2 -4,-2 Z" fill="url(#poppysGold)" opacity="0.95"/>
    <path d="M 4,-2 C 11,-12 18,-14 17,-2 C 16,8 7,10 0,12 C 4,7 5,2 4,-2 Z" fill="url(#poppysGold)" opacity="0.95"/>
    
    <!-- Outer Arching Wings/Petals -->
    <path d="M -14,3 C -23,-5 -30,-3 -26,10 C -22,20 -10,18 0,14 C -8,13 -13,9 -14,3 Z" fill="url(#poppysGold)" opacity="0.85"/>
    <path d="M 14,3 C 23,-5 30,-3 26,10 C 22,20 10,18 0,14 C 8,13 13,9 14,3 Z" fill="url(#poppysGold)" opacity="0.85"/>
    
    <!-- Base Ribbon Cradle -->
    <path d="M -22,17 C -10,23 10,23 22,17 C 14,20 -14,20 -22,17 Z" fill="url(#poppysGold)" stroke="url(#poppysGold)" stroke-width="1.2"/>
  </g>

  <!-- POPPYS Typography -->
  <text x="50" y="78" font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif" font-size="12.5" font-weight="800" letter-spacing="2.5" fill="url(#poppysGold)" text-anchor="middle">POPPYS</text>
  <text x="50" y="88" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="5" font-weight="700" letter-spacing="2" fill="#94A3B8" text-anchor="middle">HOTELS</text>
</svg>